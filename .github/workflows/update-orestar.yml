name: Refresh Oregon election data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public election data
        run: python backend/update_data.py
      - name: Commit changed data
        run: |
          git config user.name "Beyond the Ballot Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/snapshots.json data/transaction_ledger.json BeyondTheBallot/candidates.json
          git diff --cached --quiet || git commit -m "Update Oregon election data"
          git push
